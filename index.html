
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello World Card</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="business-card">

        <div class="decoration">✿</div>

        <div class="card-content">
            <p class="greeting">WELCOME TO MY LITTLE SPACE</p>

            <h1>Hello, World!</h1>

            <p class="description">
                A little corner of creativity, happiness,
                and endless possibilities.
            </p>

            <div class="divider"></div>

            <p class="footer">Made with ♡ and a little bit of code.</p>
        </div>

        <div class="flower flower-one">✿</div>
        <div class="flower flower-two">✧</div>

    </div>

</body>
</html>
